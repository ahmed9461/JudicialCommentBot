name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app scripts
      - name: Test
        run: pytest -q
