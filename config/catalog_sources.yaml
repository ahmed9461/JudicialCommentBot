version: 3

# Official-only catalog manifest. Navigation and PDF paths are deliberately
# separated so site-wide reports/forms/templates never become corpus inputs.
sources:
  - id: moj_1434
    source_id: ministry_of_justice
    source_name: وزارة العدل
    kind: numbered_pdf_series
    enabled: true
    url_template: https://www.moj.gov.sa/ar-sa/ministry/versions/Documents/backupFiles3/AhkamGroup_1434/{volume}.pdf
    volumes: {start: 1, end: 25}

  - id: moj_1435
    source_id: ministry_of_justice
    source_name: وزارة العدل
    kind: numbered_pdf_series
    enabled: true
    url_template: https://www.moj.gov.sa/ar-sa/ministry/versions/Documents/backupFiles3/AhkamGroup_1435/{volume}.pdf
    volumes: {start: 1, end: 14}

  - id: bog_judicial_blogs
    source_id: board_of_grievances
    source_name: ديوان المظالم
    kind: landing_page_crawl
    enabled: true
    landing_pages:
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/Pages/JudgmentsDefault.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1433/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1434/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1435/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1436/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1437/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1438/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1439/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1440/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1441/Pages/default.aspx
      - https://www.bog.gov.sa/knowledge-center/JudicialBlogs/1442/Pages/default.aspx
    max_depth: 5
    max_pages: 500
    page_path_prefixes:
      - /knowledge-center/JudicialBlogs/
      - /ScientificContent/JudicialBlogs/
    document_path_prefixes:
      - /ScientificContent/JudicialBlogs/
      - /knowledge-center/JudicialBlogs/
    exclude_path_fragments:
      - /AnnualReports/
      - /Templates/

  - id: gstc_decisions
    source_id: zakat_tax_customs_committees
    source_name: الأمانة العامة للجان الزكوية والضريبية والجمركية
    kind: landing_page_crawl
    enabled: true
    landing_pages:
      - https://www.gstc.gov.sa/ar/Decisions/Pages/default.aspx
      - https://www.gstc.gov.sa/ar/Decisions/Pages/decisions.aspx?year=%D8%A7%D9%84%D9%86%D8%B4%D8%B1+%D8%A7%D9%84%D9%81%D9%88%D8%B1%D9%8A+%D9%84%D9%84%D9%82%D8%B1%D8%A7%D8%B1%D8%A7%D8%AA
      - https://www.gstc.gov.sa/ar/DocumentsLb/DecisionsRules/Pages/default.aspx
    max_depth: 4
    max_pages: 260
    page_path_prefixes:
      - /ar/Decisions/
      - /ar/DocumentsLb/DecisionsRules/
    document_path_prefixes:
      - /ar/Decisions/Documents/
      - /ar/DocumentsLb/DecisionsRules/Documents/
    exclude_path_fragments:
      - /AnnualReports/
      - /Publications/
      - /Templates/

  - id: crsd_decisions
    source_id: securities_disputes
    source_name: الأمانة العامة للجان الفصل في منازعات الأوراق المالية
    kind: landing_page_crawl
    enabled: true
    landing_pages:
      - https://crsd.gov.sa/ar/ResolutionsCommittee/Decisions/Pages/default.aspx
      - https://crsd.gov.sa/ar/AppealsCommittee/Decisions/Pages/default.aspx
    max_depth: 4
    max_pages: 240
    page_path_prefixes:
      - /ar/ResolutionsCommittee/Decisions/
      - /ar/AppealsCommittee/Decisions/
    document_path_prefixes:
      - /ar/ResolutionsCommittee/Decisions/Documents/
      - /ar/AppealsCommittee/Decisions/Documents/
    exclude_path_fragments:
      - /Statistics/
      - /Templates/
      - /Manuals/
      - /About/

  - id: idc_decisions
    source_id: insurance_disputes
    source_name: الأمانة العامة للجان الفصل في المنازعات والمخالفات التأمينية
    kind: landing_page_crawl
    enabled: true
    landing_pages:
      - https://www.idc.gov.sa/ar-sa/CommitteesDecisions/Pages/Riyadh.aspx
      - https://www.idc.gov.sa/ar-sa/CommitteesDecisions/Pages/Jeddah.aspx
      - https://www.idc.gov.sa/ar-sa/CommitteesDecisions/Pages/Dammam.aspx
      - https://www.idc.gov.sa/en-us/CommitteesDecisions/Pages/Riyadh.aspx
      - https://www.idc.gov.sa/en-us/CommitteesDecisions/Pages/Jeddah.aspx
      - https://www.idc.gov.sa/en-us/CommitteesDecisions/Pages/Dammam.aspx
    max_depth: 5
    max_pages: 600
    page_path_prefixes:
      - /ar-sa/CommitteesDecisions/
      - /en-us/CommitteesDecisions/
    document_path_prefixes:
      - /ar-sa/CommitteesDecisions/
      - /en-us/CommitteesDecisions/
    exclude_path_fragments:
      - /Reports/
      - /Templates/
      - /Guides/

rules:
  skip_scanned_without_text: true
  min_case_text_chars: 350
  max_case_text_chars: 18000
  request_delay_seconds: 0.35
