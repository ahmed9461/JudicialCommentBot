slug: administrative_contracts
name_ar: العقود الإدارية
verification_status: needs_official_syllabus_review
source_notes: يفضل أحكام ديوان المظالم المتعلقة بعقد تكون جهة الإدارة طرفاً فيه وبخصائص العقد الإداري.
priority_topics:
  - مفهوم العقد الإداري وتمييزه عن العقد المدني
  - سلطات الإدارة في العقد
  - تنفيذ العقد والجزاءات
  - التوازن المالي والتعويض
  - إنهاء العقد الإداري
secondary_topics:
  - الظروف الطارئة والقوة القاهرة بحسب نطاق المقرر
  - الاختصاص القضائي في منازعات العقود الإدارية
suitable_case_patterns:
  - منازعة مقاولات حكومية أو توريد مع جهة إدارية
  - حكم حول غرامة تأخير أو سحب مشروع أو تعويض متعاقد
  - قضية تبرز امتيازات الإدارة أو التوازن المالي
avoid_case_patterns:
  - عقد مدني بين أفراد أو منشآت خاصة
search_keywords:
  - عقد إداري
  - غرامة تأخير
  - سحب المشروع
  - مقاولات حكومية
  - تعويض المتعاقد
  - توازن مالي
commentary_focus:
  - بيان سبب وصف العقد بالإداري
  - تحليل سلطة الإدارة والتزامات المتعاقد
  - شرح أساس التعويض أو الجزاء
preferred_source_hints: [board_of_grievances]
scoring_hints: {direct_topic_match_bonus: 16, weak_relation_penalty: 14}
