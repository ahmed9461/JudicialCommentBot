slug: civil_procedure
name_ar: إجراءات التقاضي
verification_status: needs_official_syllabus_review
source_notes: يفضل حكم يحسم مسألة إجرائية بوضوح مثل الاختصاص أو التبليغ أو المواعيد أو الحضور أو طرق الاعتراض.
priority_topics:
  - الاختصاص القضائي
  - رفع الدعوى وقيدها
  - التبليغ والحضور والغياب
  - الدفوع الشكلية
  - المواعيد وطرق الاعتراض
  - إدارة الجلسات وإقفال باب المرافعة بحسب المقرر
secondary_topics:
  - الأحكام وآثارها الإجرائية
  - المصروفات القضائية
suitable_case_patterns:
  - حكم بعدم الاختصاص أو عدم القبول لسبب إجرائي
  - قضية حكم غيابي وصحة التبليغ
  - نزاع حول ميعاد الاعتراض أو الاستئناف
avoid_case_patterns:
  - قضية موضوعية كاملة لا تحمل مسألة إجرائية مؤثرة
search_keywords:
  - عدم الاختصاص
  - التبليغ
  - الحكم الغيابي
  - عدم قبول الدعوى
  - ميعاد الاستئناف
  - الدفع الشكلي
commentary_focus:
  - تحديد الإجراء محل النزاع
  - بيان أثر مخالفته أو صحته على الدعوى
  - التفريق بين الحكم الشكلي والموضوعي
preferred_source_hints: [official]
