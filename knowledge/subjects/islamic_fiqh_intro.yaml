slug: islamic_fiqh_intro
name_ar: المدخل لدراسة الفقه الإسلامي
verification_status: needs_official_syllabus_review
source_notes: يفضل حكم يطبق قاعدة فقهية أو حكماً شرعياً واضحاً مع تسبيب قابل للشرح.
priority_topics:
  - مفهوم الفقه والحكم الشرعي
  - القواعد الفقهية العامة
  - مصادر الأحكام الشرعية بصورة تمهيدية
  - الحقوق والالتزامات في الفقه
secondary_topics:
  - المقاصد العامة للشريعة
  - العرف واليقين والضرر بحسب ما يظهر في الحكم
suitable_case_patterns:
  - حكم يستند إلى قاعدة فقهية مثل الضرر يزال أو اليقين لا يزول بالشك
  - حكم أحوال شخصية أو معاملة مالية بتسبيب فقهي واضح
avoid_case_patterns:
  - قضية نظامية بحتة بلا سند فقهي ظاهر
search_keywords:
  - الضرر يزال
  - لا ضرر ولا ضرار
  - اليقين لا يزول بالشك
  - العرف
  - القاعدة الفقهية
commentary_focus:
  - تحديد القاعدة الفقهية ومحل تطبيقها
  - شرح العلاقة بين الواقعة والحكم الشرعي
  - عدم اختراع قاعدة فقهية لم ترد أو لا تنطبق
preferred_source_hints: [official]
