slug: law_intro
name_ar: المدخل لدراسة علم القانون
verification_status: needs_official_syllabus_review
source_notes: خريطة تأسيسية تُراجع مع توصيف المقرر الرسمي.
priority_topics:
  - القاعدة القانونية وخصائصها
  - مصادر القانون وتطبيقه وتفسيره
  - نظرية الحق وأنواع الحقوق
  - أشخاص الحق ومحل الحق
  - استعمال الحق والتعسف في استعماله
secondary_topics:
  - التمييز بين القواعد القانونية وغيرها من القواعد الاجتماعية
  - نطاق تطبيق القانون زماناً ومكاناً
suitable_case_patterns:
  - حكم يطبق مبدأ استعمال الحق المشروع أو التعسف فيه بوضوح
  - حكم يبرز نوع حق أو مركز قانوني وآثاره
  - حكم يوضح تطبيق قاعدة قانونية أو تفسير نص
avoid_case_patterns:
  - قضية تخصصية معقدة لا يمكن ربطها بمفاهيم المدخل إلا بصورة بعيدة
  - حكم إجرائي بحت بلا مسألة عامة في نظرية القانون أو الحق
search_keywords:
  - التعسف في استعمال الحق
  - استعمال الحق
  - الحق المشروع
  - تفسير النص
  - تطبيق النظام
commentary_focus:
  - تحديد مفهوم الحق أو القاعدة القانونية الظاهر في الحكم
  - بيان حدود استعمال الحق وسبب مشروعيته أو عدم مشروعيته
  - ربط تسبيب المحكمة بمفاهيم المقرر دون تحميل الحكم ما لا يحتمل
preferred_source_hints: [official]
