slug: legal_drafting
name_ar: أصول الصياغة القانونية
verification_status: needs_official_syllabus_review
source_notes: هذا المقرر يحتاج اختياراً حذراً؛ الأفضل حكم يكشف أثر غموض أو دقة صياغة عقد أو نص على النتيجة.
priority_topics:
  - وضوح النص القانوني
  - بناء الجملة القانونية ودقة المصطلح
  - تفسير العبارات والصياغات التعاقدية
  - تجنب الغموض والتعارض
secondary_topics:
  - صياغة الشروط والالتزامات
  - أثر علامات أو ألفاظ الحصر والاستثناء بحسب المقرر
suitable_case_patterns:
  - نزاع نشأ بسبب غموض شرط تعاقدي أو صياغة غير دقيقة
  - حكم يفسر لفظاً أو عبارة قانونية مؤثرة
  - قضية توضح أثر الصياغة على تحديد الالتزام
avoid_case_patterns:
  - حكم لا يتضمن أي مشكلة تفسير أو صياغة
search_keywords:
  - تفسير العقد
  - غموض الشرط
  - صياغة العقد
  - مدلول العبارة
  - تفسير النص
commentary_focus:
  - تحديد موضع الغموض أو القوة في الصياغة
  - بيان كيف أثرت الصياغة في التفسير والحكم
  - اقتراح صياغة أوضح فقط إذا كان التكليف يسمح بذلك
preferred_source_hints: [official]
