slug: legal_history
name_ar: تاريخ القانون
verification_status: needs_official_syllabus_review
source_notes: هذا المقرر قد يحتاج أحياناً قضية ذات بعد تاريخي أو مقارنة تطور تشريعي، لذلك يخفض الاعتماد التلقائي إذا كان الربط مصطنعاً.
priority_topics:
  - تطور النظم القانونية
  - تطور القضاء والتشريع
  - انتقال القواعد وتغيرها عبر الزمن
secondary_topics:
  - مقارنة حكم قديم مع تنظيم لاحق
  - أثر التطور الاجتماعي على القاعدة القانونية
suitable_case_patterns:
  - حكم قديم يسمح بإظهار مرحلة تاريخية في التنظيم القضائي أو التشريعي
  - قضية يمكن مقارنتها بنظام لاحق لتوضيح التطور دون إسقاطه بأثر رجعي
avoid_case_patterns:
  - قضية حديثة بلا أي قيمة تاريخية أو تطور تشريعي
search_keywords:
  - مجموعة الأحكام القضائية
  - حكم قديم
  - تطور النظام
  - تنظيم سابق
commentary_focus:
  - وضع الحكم في سياقه الزمني
  - التفريق بين القانون وقت الحكم والتنظيم اللاحق
  - إبراز التطور لا تقييم الحكم بقواعد لم تكن نافذة آنذاك
preferred_source_hints: [official_compilation]
