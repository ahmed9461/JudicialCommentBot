slug: usul_al_fiqh
name_ar: أصول الفقه
verification_status: needs_official_syllabus_review
source_notes: النماذج المرجعية تشير إلى أهمية الربط بالدلالات والقواعد الأصولية ومصادر الأحكام دون تكلف.
priority_topics:
  - الأدلة الشرعية ومصادر الأحكام
  - دلالات الألفاظ
  - العام والخاص والمطلق والمقيد بحسب المقرر
  - القياس والاستصحاب والعرف والمصلحة بحسب نطاق المقرر
  - الحكم الشرعي والسبب والشرط والمانع
secondary_topics:
  - مقاصد الشريعة عند صلتها المباشرة
  - القواعد الأصولية المؤثرة في فهم النص
suitable_case_patterns:
  - حكم يستند إلى نص أو قاعدة تسمح بتحليل دلالته
  - قضية يظهر فيها الاستصحاب أو دلالة العبارة أو السبب والشرط
  - حكم فقهي فيه منهج استدلال واضح
avoid_case_patterns:
  - قضية لا تحتوي أي مادة أصولية حقيقية ويحتاج ربطها إلى تخمين
search_keywords:
  - استصحاب
  - دلالة العبارة
  - سبب شرط مانع
  - الأصل بقاء ما كان
  - اليقين لا يزول بالشك
  - قاعدة أصولية
commentary_focus:
  - تحديد الأداة الأصولية التي ظهرت فعلاً
  - شرح كيفية تأثيرها في النتيجة
  - عدم تحويل كل قاعدة فقهية إلى قاعدة أصولية دون تمييز
preferred_source_hints: [official]
